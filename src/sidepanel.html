<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orionis Capture</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="panel">
      <header class="panel-header">
        <img class="logo" src="../assets/icon.svg" alt="" aria-hidden="true">
        <div>
          <h1>Orionis Capture</h1>
          <p id="status" role="status">Ready to capture this LinkedIn job.</p>
        </div>
      </header>

      <section class="actions" aria-label="Capture actions">
        <button id="refresh" type="button">Refresh From Page</button>
        <button id="copy" type="button" class="primary">Copy Markdown</button>
      </section>

      <label class="editor-label" for="markdown">Markdown</label>
      <textarea id="markdown" spellcheck="true" placeholder="Open a LinkedIn job post, then refresh from page."></textarea>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
