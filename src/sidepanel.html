<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orionis Capture</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="panel">
      <header class="panel-header">
        <div class="header-row">
          <div class="brand-lockup">
            <img class="logo" src="../assets/icon.svg" alt="" aria-hidden="true">
            <div>
              <h1>Orionis Capture</h1>
              <p class="subtitle" data-i18n="app.subtitle">Job post to structured Markdown</p>
            </div>
          </div>
          <div class="settings-menu">
            <button id="settings" type="button" class="icon-button" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-popover" aria-label="Open settings" data-i18n-aria-label="settings.open">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M19.4 13.5a7.6 7.6 0 0 0 .1-1.5 7.6 7.6 0 0 0-.1-1.5l2-1.5-2-3.5-2.4 1a7.5 7.5 0 0 0-2.6-1.5L14 2h-4l-.4 2.5A7.5 7.5 0 0 0 7 6L4.6 5 2.6 8.5l2 1.5a7.6 7.6 0 0 0-.1 1.5 7.6 7.6 0 0 0 .1 1.5l-2 1.5 2 3.5 2.4-1a7.5 7.5 0 0 0 2.6 1.5L10 22h4l.4-2.5A7.5 7.5 0 0 0 17 18l2.4 1 2-3.5zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/>
              </svg>
            </button>
            <section id="settings-popover" class="settings-popover" aria-labelledby="language-label" hidden>
              <label id="language-label" for="language" data-i18n="settings.languageLabel">Language</label>
              <select id="language">
                <option value="auto" data-i18n="settings.languageAuto">Auto</option>
                <option value="en" data-i18n="settings.languageEnglish">English</option>
                <option value="es" data-i18n="settings.languageSpanish">Spanish</option>
              </select>
            </section>
          </div>
        </div>
        <p id="status" class="status status-info" role="status" aria-live="polite" data-i18n="status.ready">Ready to capture this job post as Markdown.</p>
      </header>

      <section class="toolbar" aria-label="Capture actions">
        <button id="refresh" type="button" class="button-secondary">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M20 11a8.1 8.1 0 0 0-14.1-5.4L4 7.5V3H2v8h8V9H5.4l1.9-1.9A6.1 6.1 0 0 1 18 11z"/>
            <path d="M4 13a8.1 8.1 0 0 0 14.1 5.4l1.9-1.9V21h2v-8h-8v2h4.6l-1.9 1.9A6.1 6.1 0 0 1 6 13z"/>
          </svg>
          <span data-i18n="actions.refresh">Refresh</span>
        </button>
        <button id="copy" type="button" class="button-secondary">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M8 7a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-1v-2h1a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v1H8z"/>
            <path d="M4 11a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3zm3-1a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1z"/>
          </svg>
          <span data-i18n="actions.copy">Copy</span>
        </button>
        <button id="save" type="button" class="button-primary">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M5 3h12l2 2v16H5zm2 2v14h10V6.1L15.9 5z"/>
            <path d="M8 5h7v5H8zm2 2v1h3V7zM8 15h8v2H8z"/>
          </svg>
          <span data-i18n="actions.save">Save</span>
        </button>
      </section>

      <section class="editor-shell" aria-labelledby="markdown-label">
        <div class="editor-header">
          <label id="markdown-label" class="editor-label" for="markdown" data-i18n="editor.label">Markdown</label>
          <span class="editor-hint" data-i18n="editor.hint">Editable draft</span>
        </div>
        <textarea id="markdown" spellcheck="true" data-i18n-placeholder="editor.placeholder" placeholder="Open a LinkedIn, Wellfound, BigRemoteJob, Not Yet Unicorns, or Ashby job post, then refresh to generate structured Markdown."></textarea>
      </section>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
